{
    "extractor": {
        "base-directory": "media-downloads",
        "archive": null,
		
		"instagram": {
			"videos": "ytdl",
			"ytdl" : {
				"format": "avc1"
			},
			"ytdl-args" : [
				"-f", "bv[ext=mp4][vcodec^=avc]+ba[ext=m4a]/b[ext=mp4]"
			],
			"postprocessors": [
                {
                    "name": "metadata",
                    "extension": "txt",
                    "content": "{content|description|caption}"
                }
            ]
        },

		"tiktok": {
			"videos": "ytdl",
			"postprocessors": [
                {
                    "name": "metadata",
                    "extension": "txt",
                    "content": "{description|caption}"
                }
            ]
        },
        "reddit": {
			"videos": "ytdl",
			"postprocessors": [
                {
                    "name": "metadata",
                    "extension": "txt",
                    "content": "{description|caption|title}"
                }
            ]
        },
        "twitter": {
			"videos": "ytdl",
			"postprocessors": [
                {
                    "name": "metadata",
                    "extension": "txt",
                    "content": "{description|caption|title}"
                },
                {
                	"name": "exec",
                	"event": "after",
                	"filter": "type == 'animated_gif'",
                	"command": "FILE=\"{_path}\"; ffmpeg -y -i \"$FILE\" \"${FILE%.*}.gif\" && rm \"$FILE\""
                }
            ]
        }
    }
}
